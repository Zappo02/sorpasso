<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sorpasso – Universo Sportivo</title>
<style>
:root{--bg:#0c0f1d;--accent:#ff3b3b;--gold:#ffc83d;--text:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#wrap{max-width:520px;margin:0 auto;padding:0 0 14px}
#stage{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block}
#c{width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:11px;background:linear-gradient(180deg,rgba(12,15,29,.35),rgba(12,15,29,.9) 55%)}
.hidden{display:none!important}
.brand{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--gold);opacity:.9}
h1{font-size:46px;line-height:1;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-1px;text-shadow:0 4px 0 #a01818,0 10px 24px rgba(0,0,0,.5)}
h2{font-size:32px;font-weight:900;font-style:italic;text-transform:uppercase;color:var(--accent);text-shadow:0 3px 0 #5a0b0b}
h2.white{color:#fff;text-shadow:0 3px 0 #a01818}
.sub{font-size:14px;opacity:.9;max-width:340px}
.how{list-style:none;font-size:12.5px;line-height:1.4;max-width:370px;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.how li{display:flex;gap:8px}
.how b{color:var(--gold)}
.btn{font:inherit;font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:linear-gradient(180deg,#ff5050,#d61f1f);border:0;border-radius:999px;padding:13px 32px;cursor:pointer;box-shadow:0 5px 0 #7d0f0f,0 10px 22px rgba(0,0,0,.4)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7d0f0f}
.btn.ghost{background:rgba(255,255,255,.12);box-shadow:0 5px 0 rgba(0,0,0,.35);font-size:15px;padding:13px 20px}
.bestline{font-size:13px;opacity:.85}
.bestline b{color:var(--gold)}
.big{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;opacity:.7}
.earn{font-size:18px;font-weight:900;color:var(--gold)}
.newbest{color:var(--gold);font-weight:900;text-transform:uppercase;letter-spacing:1px;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%;max-width:330px}
.cell{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px}
.cell b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#lang{position:absolute;top:10px;right:10px;z-index:5;font:inherit;font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 10px;cursor:pointer}
#garage{background:rgba(12,15,29,.95);justify-content:flex-start;padding-top:20px}
.coins{font-size:17px;font-weight:900;color:var(--gold)}
.carlist{width:100%;max-width:410px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
.card.sel{border-color:var(--gold);background:rgba(255,200,61,.1)}
.card.lock canvas{filter:grayscale(.85) brightness(.6)}
.card canvas{width:84px;height:53px;flex:none}
.card .info{flex:1;text-align:left;min-width:0}
.card .nm{font-weight:900;font-size:15px}
.stat{display:flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;opacity:.85;margin-top:3px}
.stat span{width:80px;flex:none}
.bar{flex:1;height:5px;background:rgba(255,255,255,.15);border-radius:3px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.card button{font:inherit;font-weight:900;font-size:13px;color:#fff;border:0;border-radius:999px;padding:9px 12px;min-width:86px;cursor:pointer;background:#d61f1f}
.card button.owned{background:rgba(255,255,255,.15)}
.card button.cur{background:var(--gold);color:#1a1200;cursor:default}
.card button:disabled:not(.cur){background:rgba(255,255,255,.08);color:rgba(255,255,255,.45);cursor:default}
#ctrl{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;margin:10px 4px 0}
#ctrl button{height:60px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:#1b2140;color:#fff;font:inherit;font-size:24px;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#ctrl button.on{background:#323c78}
#ctrl .brake{background:#3a1520;font-size:15px;letter-spacing:1.5px}
#ctrl .brake.on{background:#8a2232}
.allgames{display:block;margin:12px 12px 0;text-align:center;font-weight:800;font-size:15px;color:#fff;text-decoration:none;background:#1b2140;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px}
.allgames:hover{background:#242b52}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <button id="lang">EN</button>
    <div id="menu" class="overlay">
      <div class="brand">UNIVERSO SPORTIVO</div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
      <ul class="how">
        <li>👆 <span data-t="how1"></span></li>
        <li>🛑 <span data-t="how2"></span></li>
        <li>💨 <span data-t="how3"></span></li>
        <li>⚠️ <span data-t="how4"></span></li>
        <li>💰 <span data-t="how5"></span></li>
      </ul>
      <div class="row">
        <button class="btn" id="playBtn" data-t="play"></button>
        <button class="btn ghost" id="garageBtn1" data-t="garage"></button>
      </div>
      <div class="bestline"><span data-t="best"></span>: <b id="bestMenu">0</b> · 💰 <b id="coinsMenu">0</b></div>
    </div>
    <div id="over" class="overlay hidden">
      <h2 data-t="over"></h2>
      <div id="newBest" class="newbest hidden" data-t="newbest"></div>
      <div><div class="lbl" data-t="score"></div><div class="big" id="finalScore">0</div></div>
      <div class="earn">+<span id="earn">0</span> 💰</div>
      <div class="grid">
        <div class="cell"><span class="lbl" data-t="dist"></span><b id="sDist">0</b></div>
        <div class="cell"><span class="lbl" data-t="near"></span><b id="sNear">0</b></div>
        <div class="cell"><span class="lbl" data-t="passes"></span><b id="sPass">0</b></div>
        <div class="cell"><span class="lbl" data-t="top"></span><b id="sTop">0</b></div>
      </div>
      <div class="bestline"><span data-t="best"></span>: <b id="bestOver">0</b> · 💰 <b id="coinsOver">0</b></div>
      <div class="row">
        <button class="btn" id="againBtn" data-t="again"></button>
        <button class="btn ghost" id="garageBtn2" data-t="garage"></button>
        <button class="btn ghost" id="shareBtn" data-t="share"></button>
      </div>
    </div>
    <div id="garage" class="overlay hidden">
      <h2 class="white" data-t="garage"></h2>
      <div class="coins">💰 <span id="coinsG">0</span></div>
      <div id="carList" class="carlist"></div>
      <button class="btn ghost" id="backBtn" data-t="back"></button>
    </div>
  </div>
  <div id="ctrl">
    <button data-c="l" aria-label="sinistra">◀</button>
    <button data-c="b" class="brake" data-t="brake"></button>
    <button data-c="r" aria-label="destra">▶</button>
  </div>
  <a class="allgames" href="https://universosportivo.com/giochi" target="_top" data-t="all"></a>
</div>

<script>
(()=>{
"use strict";
/* ---------------- TESTI ---------------- */
const T={
 it:{title:'Sorpasso',sub:'Sfreccia nel traffico, sfiora le auto, attraversa nuovi paesaggi.',
  how1:'Tieni premuto a <b>sinistra</b> o a <b>destra</b> (o usa ◀ ▶ / le frecce) per sterzare',
  how2:'Tieni premuto <b>FRENO</b> (o ↓) per rallentare',
  how3:'Passa vicinissimo alle auto: <b>sorpasso al limite</b> = bonus e combo',
  how4:'Le corsie di sinistra sono <b>contromano</b>: punti ×2',
  how5:'Guadagni <b>monete</b> con il punteggio: sblocca nuove auto nel Garage',
  play:'Gioca',again:'Rigioca',over:'Incidente!',score:'Punteggio',best:'Record',dist:'Distanza',near:'Al limite',
  passes:'Sorpassi',top:'Velocità max',share:'Condividi',copied:'Copiato!',newbest:'Nuovo record!',
  wrong:'CONTROMANO ×2',nm:'AL LIMITE',combo:'COMBO',all:'Tutti i giochi di Universo Sportivo',
  garage:'Garage',back:'Indietro',choose:'Scegli',selected:'In uso',brake:'FRENO',spd:'Velocità',hdl:'Manovrabilità',
  newArea:'NUOVO SCENARIO',
  shareTxt:(s,n,d)=>`🚗 Sorpasso – Universo Sportivo\n🏁 Punteggio: ${s}\n💨 Sorpassi al limite: ${n}\n📏 Distanza: ${d} km\nSfidami 👉 https://universosportivo.com/giochi`},
 en:{title:'Overtake',sub:'Weave through traffic, skim past cars, drive into new landscapes.',
  how1:'Hold <b>left</b> or <b>right</b> (or use ◀ ▶ / arrow keys) to steer',
  how2:'Hold <b>BRAKE</b> (or ↓) to slow down',
  how3:'Pass cars as close as you can: <b>near miss</b> = bonus and combos',
  how4:'The left lanes are <b>oncoming traffic</b>: ×2 points',
  how5:'Earn <b>coins</b> from your score: unlock new cars in the Garage',
  play:'Play',again:'Play again',over:'Crash!',score:'Score',best:'Best',dist:'Distance',near:'Near misses',
  passes:'Overtakes',top:'Top speed',share:'Share',copied:'Copied!',newbest:'New record!',
  wrong:'WRONG WAY ×2',nm:'NEAR MISS',combo:'COMBO',all:'All Universo Sportivo games',
  garage:'Garage',back:'Back',choose:'Select',selected:'In use',brake:'BRAKE',spd:'Speed',hdl:'Handling',
  newArea:'NEW AREA',
  shareTxt:(s,n,d)=>`🚗 Overtake – Universo Sportivo\n🏁 Score: ${s}\n💨 Near misses: ${n}\n📏 Distance: ${d} km\nBeat me 👉 https://universosportivo.com/giochi`}
};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=ls.get('sorpasso_lang')||((navigator.language||'it').startsWith('it')?'it':'en');
const $=s=>document.querySelector(s);
function applyLang(){
  const L=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{const v=L[el.dataset.t];if(typeof v==='string')el.innerHTML=v;});
  $('#lang').textContent=lang==='it'?'EN':'IT';
  document.title=L.title+' – Universo Sportivo';
  renderGarage();
}
$('#lang').addEventListener('click',e=>{e.stopPropagation();lang=lang==='it'?'en':'it';ls.set('sorpasso_lang',lang);applyLang();});

/* ---------------- CANVAS ---------------- */
const stage=$('#stage'),cv=$('#c'),ctx=cv.getContext('2d');
let W=360,H=520,DPR=1,HOR=0,PY=0,K=0,HX=0;
function resize(){
  W=stage.clientWidth||360; H=Math.round(W*1.45);
  stage.style.height=H+'px';
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  HOR=H*0.36; PY=H*0.93; K=PY-HOR; HX=W*0.42;
  sendH();
}
function sendH(){try{const h=document.documentElement.scrollHeight;parent.postMessage({type:'resize',height:h,frameHeight:h},'*');}catch(e){}}
window.addEventListener('resize',resize);

/* ---------------- STRADA ---------------- */
const SEG=200,N=3000,ROADW=2000,CAMH=1100,DEPTH=1/Math.tan(50*Math.PI/180),DRAW=170,PZ=CAMH*DEPTH;
const LANES=[-0.75,-0.25,0.25,0.75];
const curves=new Float32Array(N);
function buildRoad(){
  let i=0;
  const set=v=>{if(i<N)curves[i++]=v;};
  const io=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+.5);
  for(let k=0;k<80;k++)set(0);
  while(i<N-260){
    if(Math.random()<0.35){const n=40+Math.random()*90|0;for(let k=0;k<n;k++)set(0);}
    else{
      const c=(Math.random()<.5?-1:1)*(1+Math.random()*2.6);
      const e=30+Math.random()*20|0,hl=40+Math.random()*90|0;
      for(let k=0;k<e;k++)set(io(0,c,k/e));
      for(let k=0;k<hl;k++)set(c);
      for(let k=0;k<e;k++)set(io(c,0,k/e));
    }
  }
  while(i<N)set(0);
}
const curveAt=i=>curves[((i%N)+N)%N];
const hash=n=>{const s=Math.sin(n*12.9898+78.233)*43758.5453;return s-Math.floor(s);};
function noise1(t,seed){const i=Math.floor(t),f=t-i,u=f*f*(3-2*f);const a=hash(i+seed*1000),b=hash(i+1+seed*1000);return a+(b-a)*u;}

/* ---------------- COLORI / BIOMI ---------------- */
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const L3=(a,b,t)=>t<=0?a:t>=1?b:[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const BIOME_LEN=300000,BIOME_TR=14000;
const BIOMES=[
 {id:'country',name:{it:'Campagna',en:'Countryside'},sky:['#1f1748','#6a2c72','#ff7b5a','#ffc58a'],fog:'#eaa688',g1:'#3f8a3c',g2:'#47963f',a1:'#565965',a2:'#5e616d',m1:'#8a4a80',m2:'#5a2f62',sun:'#fff0be',night:0,amp:1},
 {id:'coast',name:{it:'Costa',en:'Coast'},sky:['#1e78c0','#4fb2e6','#a8e2f5','#e9f8fb'],fog:'#cdebf3',g1:'#e3cf98',g2:'#ecd9a6',a1:'#5a5d68',a2:'#61646f',m1:'#2f86b3',m2:'#3aa3c4',sun:'#ffffff',night:0,amp:.22},
 {id:'desert',name:{it:'Deserto',en:'Desert'},sky:['#2a6fb8','#5fa3dc','#f5d39b','#ffe2b0'],fog:'#f0d2a0',g1:'#d9a85b',g2:'#e2b46a',a1:'#6b625a',a2:'#746a61',m1:'#c9845a',m2:'#a0603c',sun:'#fffbe6',night:0,amp:.9},
 {id:'snow',name:{it:'Montagna innevata',en:'Snowy mountains'},sky:['#3d6fa8','#86b3dd','#d6e9f7','#f2f8fd'],fog:'#e3ecf5',g1:'#eef3f8',g2:'#dde7f0',a1:'#4a4f5a',a2:'#525764',m1:'#9db3cd',m2:'#7189a8',sun:'#ffffff',night:0,amp:1.5},
 {id:'city',name:{it:'Città di notte',en:'Night city'},sky:['#05060f','#0d1233','#2a1f55','#5b3a7a'],fog:'#3a2c5c',g1:'#2a2c36',g2:'#30323d',a1:'#3b3d48',a2:'#42444f',m1:'#1e2140',m2:'#14162d',sun:'#f4f1e0',night:1,amp:1,city:true}
];
BIOMES.forEach(b=>{['fog','g1','g2','a1','a2','m1','m2','sun'].forEach(k=>b[k]=hex2rgb(b[k]));b.sky=b.sky.map(hex2rgb);});
function biomeAt(z){
  const k=Math.floor(Math.max(0,z)/BIOME_LEN),r=Math.max(0,z)-k*BIOME_LEN;
  const a=BIOMES[k%BIOMES.length],b=BIOMES[(k+1)%BIOMES.length];
  const t=r>BIOME_LEN-BIOME_TR?(r-(BIOME_LEN-BIOME_TR))/BIOME_TR:0;
  return [a,b,t];
}
const R1=hex2rgb('#c62828'),R2=hex2rgb('#f1f1f1'),LW=hex2rgb('#f4f4f4'),LY=hex2rgb('#ffcc33');
let FOGc=BIOMES[0].fog;
const fogc=(c,f)=>f<=0?rgb(c):rgb(L3(c,FOGc,f));

/* ---------------- SPRITE ---------------- */
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c;}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill();}
function poly(g,p,col){g.fillStyle=col;g.beginPath();g.moveTo(p[0],p[1]);for(let k=2;k<p.length;k+=2)g.lineTo(p[k],p[k+1]);g.closePath();g.fill();}
function shade(hex,p){const c=hex2rgb(hex).map(v=>Math.max(0,Math.min(255,Math.round(v+(p<0?v*p:(255-v)*p)))));return `rgb(${c})`;}
function ell(g,x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill();}

function carSprite(col,front,van){
  return mk(200,van?200:150,(g,w,h)=>{
    ell(g,100,h-6,98,8,'rgba(0,0,0,.35)');
    g.fillStyle='#111';rr(g,14,h-40,34,34,6);rr(g,152,h-40,34,34,6);
    if(van){
      g.fillStyle=col;rr(g,6,14,188,h-48,14);
      g.fillStyle='rgba(255,255,255,.16)';rr(g,12,18,176,8,4);
      const gl=g.createLinearGradient(0,26,0,74);gl.addColorStop(0,'#1c2740');gl.addColorStop(1,'#46648a');
      g.fillStyle=gl;rr(g,22,28,156,front?50:40,8);
    }else{
      poly(g,[40,66,160,66,142,10,58,10],shade(col,-.25));
      const gl=g.createLinearGradient(0,16,0,62);gl.addColorStop(0,'#1c2740');gl.addColorStop(1,'#4d6d94');
      poly(g,[52,62,148,62,136,18,64,18],gl);
      g.fillStyle=col;rr(g,6,58,188,h-92,14);
      g.fillStyle='rgba(255,255,255,.18)';rr(g,12,62,176,7,4);
    }
    const ly=h-70;
    if(front){
      g.fillStyle='#fff7cf';rr(g,14,ly,40,16,6);rr(g,146,ly,40,16,6);
      g.fillStyle='#1a1a1a';rr(g,64,ly+2,72,18,5);
    }else{
      g.fillStyle='#ff2a2a';rr(g,12,ly,42,14,5);rr(g,146,ly,42,14,5);
      g.fillStyle='#f2f2f2';rr(g,80,ly+16,40,12,2);
    }
    g.fillStyle='#222';rr(g,8,h-42,184,10,4);
  });
}

/* Auto del giocatore */
const STYLES={
 sport:{cab:[58,70,182,70,160,22,80,22],by:60,bh:64,br:18,spoiler:1,wh:42},
 hatch:{cab:[42,72,198,72,180,12,60,12],by:62,bh:62,br:22,spoiler:0,wh:42},
 pickup:{cab:[48,62,192,62,178,8,62,8],by:54,bh:72,br:12,spoiler:0,wh:50,bar:1},
 muscle:{cab:[66,66,174,66,156,28,84,28],by:58,bh:66,br:10,spoiler:0,wh:46},
 super:{cab:[76,70,164,70,148,36,92,36],by:64,bh:56,br:26,spoiler:2,wh:40}
};
const CARS=[
 {id:'city',name:{it:'Citycar',en:'City Car'},price:0,spd:.9,hdl:1.15,body:'#2f9be0',style:'hatch'},
 {id:'gt',name:{it:'Rossa GT',en:'Red GT'},price:0,spd:1,hdl:1,body:'#e31b23',stripe:'rgba(255,255,255,.9)',style:'sport'},
 {id:'jeep',name:{it:'Fuoristrada',en:'Off-roader'},price:600,spd:.97,hdl:1.08,body:'#55753f',style:'pickup'},
 {id:'muscle',name:{it:'Muscle Car',en:'Muscle Car'},price:1500,spd:1.1,hdl:.92,body:'#23232b',stripe:'#ffc83d',style:'muscle'},
 {id:'super',name:{it:'Supercar',en:'Supercar'},price:3000,spd:1.18,hdl:1.1,body:'#ffcc00',stripe:'#151515',style:'super'},
 {id:'neon',name:{it:'Elettrica Neon',en:'Neon EV'},price:5000,spd:1.25,hdl:1.22,body:'#7b2ff7',stripe:'#00f0ff',style:'super',glow:true}
];
function playerSprite(d){
  const s=STYLES[d.style];
  return mk(240,150,(g,w,h)=>{

let state='menu',position=0,speed=0,maxSpeed=0,gap=3000,playerX=.75,steerVis=0,skyOff=0,time=0,elapsed=0;
let cars=[],nextSpawn=0,score=0,nears=0,passes=0,dist=0,topSpeed=0,combo=0,comboTimer=0,braking=false;
let spin=0,spinDir=1,shake=0,flash=0,crashT=0,popups=[],hintT=0,paused=false,lastBiome=0,banner=null;
const keys={l:false,r:false,b:false},ctrl={l:false,r:false,b:false};const pointers=new Map();

function reset(){
  position=0;cars=[];nextSpawn=7000;score=0;nears=0;passes=0;dist=0;topSpeed=0;combo=0;comboTimer=0;
  elapsed=0;spin=0;shake=0;flash=0;crashT=0;popups=[];hintT=0;steerVis=0;lastBiome=0;banner=null;braking=false;
}
function startGame(){
  reset();state='play';speed=4500;playerX=.25;
  ['#menu','#over','#garage'].forEach(s=>$(s).classList.add('hidden'));$('#lang').classList.add('hidden');sendH();
}
function toMenu(){reset();state='menu';speed=6500;playerX=.75;}

function spawnCar(z,demo){
  const near=cars.filter(c=>Math.abs(c.z-z)<900).length;
  if(near>=(elapsed<35&&!demo?1:2))return;
  for(let a=0;a<4;a++){
    const li=Math.random()*4|0;
    if(demo&&li===3)continue;
    const x=LANES[li];
    if(cars.some(c=>c.x===x&&Math.abs(c.z-z)<1800))continue;
    const dir=li<2?-1:1,van=Math.random()<.22;
    const col=COLORS[Math.random()*COLORS.length|0];
    cars.push({z,x,dir,v:dir*(4200+Math.random()*3000),van,ww:van?760:700,len:van?640:420,
      img:getCar(col,dir<0,van),passed:false,prevRel:z-(position+PZ)});
    return;
  }
}
function popup(txt,sub,col){popups.push({txt,sub,col,t:0});}

function update(dt){
  time+=dt;
  const demo=state==='menu';
  braking=false;
  if(state==='play'){
    elapsed+=dt;hintT+=dt;
    const d=Math.min(1,elapsed/180);
    maxSpeed=(8500+8500*d)*CAR.spd;gap=4600-2900*d;
    braking=keys.b||ctrl.b;
    if(braking)speed=Math.max(2500,speed-11000*dt);
    else if(speed<maxSpeed)speed=Math.min(maxSpeed,speed+(speed<7000?5000:2200)*dt);
    else speed=Math.max(maxSpeed,speed-3000*dt);
  }else if(demo){speed=6500;gap=3800;}
  else if(state==='crash'){
    speed=Math.max(0,speed-15000*dt);crashT+=dt;
    spin+=dt*spinDir*(1+speed/4000)*2.2;
    if(crashT>1.15)gameOver();
  }
  position+=speed*dt;
  const sp=speed/17500;
  let steer=0;
  if(state==='play'){
    let L=keys.l||ctrl.l,R=keys.r||ctrl.r;pointers.forEach(s=>{if(s<0)L=true;else R=true;});
    if(L)steer-=1;if(R)steer+=1;
  }
  playerX+=steer*dt*(1.45+0.9*sp)*CAR.hdl;
  const ci=curveAt(Math.floor((position+PZ)/SEG));
  if(state==='play')playerX-=dt*sp*ci*0.11;
  playerX=Math.max(-.92,Math.min(.92,playerX));
  steerVis+=(steer-steerVis)*Math.min(1,dt*9);
  skyOff+=ci*sp*dt*0.06;

  if(state==='play'){
    const bk=Math.floor((position+PZ)/BIOME_LEN);
    if(bk!==lastBiome){lastBiome=bk;banner={name:BIOMES[bk%BIOMES.length].name,t:0};}
  }
  if(banner){banner.t+=dt;if(banner.t>2.8)banner=null;}

  if(state!=='crash'){
    while(nextSpawn<position+DRAW*SEG){spawnCar(nextSpawn,demo);nextSpawn+=gap*(0.5+Math.random());}
  }
  for(const c of cars){
    for(const o of cars){
      if(o===c||o.x!==c.x)continue;
      const ahead=c.dir>0?o.z-c.z:c.z-o.z;
      if(ahead>0&&ahead<950)c.v=c.dir>0?Math.min(c.v,o.v):Math.max(c.v,o.v);
    }
  }
  for(const c of cars)c.z+=c.v*dt;
  cars=cars.filter(c=>c.z>position-1500);

  if(state==='play'){
    const pz=position+PZ;
    for(const c of cars){
      const rel=c.z-pz,lat=Math.abs(c.x-playerX),half=(c.len+420)/2;
      const crossed=(c.prevRel>0)!==(rel>0);
      if(lat<0.28&&(Math.abs(rel)<half||crossed)){crash(c);break;}
      if(!c.passed&&c.prevRel>0&&rel<=0){
        c.passed=true;
        if(c.dir>0)passes++;
        if(lat<0.5){
          combo=comboTimer>0?Math.min(combo+1,8):1;comboTimer=3;
          const pts=Math.round(100*combo*(c.dir<0?2:1));score+=pts;nears++;
          popup(T[lang].nm+' +'+pts,combo>1?T[lang].combo+' ×'+combo:'',c.dir<0?'#ff5a5a':'#ffc83d');
          try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}
        }
      }
      c.prevRel=rel;
    }
    if(state==='play'){
      score+=speed*dt*0.01*(playerX<0?2:1);
      dist+=speed*dt;topSpeed=Math.max(topSpeed,speed);
    }
  }
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0;}
  shake=Math.max(0,shake-dt*1.6);flash=Math.max(0,flash-dt*2.5);
  for(const p of popups)p.t+=dt;
  popups=popups.filter(p=>p.t<1.2);
}
function crash(c){
  state='crash';crashT=0;shake=1;flash=1;spinDir=c.x<playerX?1:-1;
  c.v*=0.2;pointers.clear();keys.l=keys.r=keys.b=false;
  try{navigator.vibrate&&navigator.vibrate(220);}catch(e){}
}
const kmh=v=>Math.round(v*0.018);
function gameOver(){
  state='over';
  const s=Math.floor(score),isBest=s>best,earned=Math.floor(s/25);
  if(isBest){best=s;ls.set('sorpasso_best',best);}
  coins+=earned;saveProgress();refreshCoins();
  $('#finalScore').textContent=fmt(s);$('#earn').textContent=fmt(earned);
  $('#sDist').textContent=(dist*0.005/1000).toFixed(2)+' km';
  $('#sNear').textContent=nears;$('#sPass').textContent=passes;

}

const Xs=new Float64Array(DRAW+3),Px=new Float64Array(DRAW+3),Py=new Float64Array(DRAW+3),Pw=new Float64Array(DRAW+3),Pok=new Uint8Array(DRAW+3);

function drawRange(off,amp,col,seed,freq,blocky){

function drawSky(cb){

  ctx.fillStyle=g;ctx.fillRect(0,0,W,HOR+1);
  const night=A.night+(B.night-A.night)*t;
  if(night>.02){
    for(let k=0;k<70;k++){
      const sx=((hash(k*3.1)*W*1.5-skyOff*W*.1)%(W*1.5)+W*1.5)%(W*1.5)-W*.25,sy=hash(k*7.7)*HOR*.8;
      ctx.fillStyle=`rgba(255,255,255,${night*(.35+hash(k)*.6)})`;ctx.fillRect(sx,sy,1.6,1.6);

  const sun=L3(A.sun,B.sun,t),span=W*1.6;

  const rad=W*(.22-.12*night);
  const sg=ctx.createRadialGradient(sx,sy,2,sx,sy,rad);
  sg.addColorStop(0,rgba(sun,1));sg.addColorStop(.1+.15*(1-night),rgba(sun,.9));sg.addColorStop(1,rgba(sun,0));

  drawRange(skyOff*W*.5,H*.13*amp,rgb(L3(A.m1,B.m1,t)),1,90,blocky);

  }
  if(bio!=='desert'&&m%12===0){push(lampL,700,-1.14);push(lampR,700,1.14);}
  if(m%160===80){push(board,3000,(m%320===80)?-1.8:1.8);return;}
  if(m%3!==1)return;
  if(bio==='country'){if(r<.7)push(r<.22?bush:tree,r<.22?950:1600,s*off);}
  else if(bio==='coast'){if(r<.5)push(palm,1800,s*off);else if(r<.62)push(bush,900,s*off);}
  else if(bio==='desert'){if(r<.3)push(cactus,700,s*off);else if(r<.5)push(rock,1100,s*(off+.4));}
  else if(bio==='snow'){if(r<.6)push(snowPine,1600,s*off);else if(r<.72)push(snowRock,1100,s*(off+.3));}
}
function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*16,(Math.random()-.5)*shake*16);
  const cb=biomeAt(position+PZ);
  FOGc=L3(cb[0].fog,cb[1].fog,cb[2]);
  drawSky(cb);
  ctx.fillStyle=fogc(L3(cb[0].g1,cb[1].g1,cb[2]),.6);ctx.fillRect(-20,HOR,W+40,H-HOR+20);
  const baseIdx=Math.floor(position/SEG),basePct=position/SEG-baseIdx;
  const camX=playerX*ROADW;
  let x=0,dx=-curveAt(baseIdx)*basePct;
  for(let n=0;n<=DRAW+1;n++){
    const i=baseIdx+n,z=i*SEG-position;
    Xs[n]=x;
    if(z>1){const sc=DEPTH/z;Px[n]=W/2-sc*(camX-x)*HX;Py[n]=HOR+sc*CAMH*K;Pw[n]=sc*ROADW*HX;Pok[n]=1;}else Pok[n]=0;
    x+=dx;dx+=curveAt(i);
  }
  for(let n=DRAW;n>=0;n--){
    if(!Pok[n]||!Pok[n+1])continue;
    const x1=Px[n],y1=Py[n],w1=Pw[n],x2=Px[n+1],y2=Py[n+1],w2=Pw[n+1];
    if(y2>H+2||y1<=y2)continue;
    const i=baseIdx+n,dark=Math.floor(i/3)%2,f=Math.max(0,(n/DRAW-.45)/.55);
    const [A,B,t]=biomeAt(i*SEG);
    ctx.fillStyle=fogc(dark?L3(A.g1,B.g1,t):L3(A.g2,B.g2,t),f);ctx.fillRect(-20,y2,W+40,y1-y2+1);
    P4(x1-w1*1.07,y1,x1+w1*1.07,y1,x2+w2*1.07,y2,x2-w2*1.07,y2,fogc(dark?R1:R2,f));
    P4(x1-w1,y1,x1+w1,y1,x2+w2,y2,x2-w2,y2,fogc(dark?L3(A.a1,B.a1,t):L3(A.a2,B.a2,t),f));
    if(w1>4){
      const line=(o,hw,c)=>P4(x1+(o-hw)*w1,y1,x1+(o+hw)*w1,y1,x2+(o+hw)*w2,y2,x2+(o-hw)*w2,y2,c);
      const lw=fogc(LW,f),ly=fogc(LY,f);
      line(-.95,.012,lw);line(.95,.012,lw);
      line(-.03,.011,ly);line(.03,.011,ly);
      if(!dark){line(-.5,.013,lw);line(.5,.013,lw);}
    }
  }
  const items=[],far=DRAW*SEG;
  for(let n=DRAW;n>=1;n--){
    const i=baseIdx+n,z=i*SEG-position;if(z<=420)continue;
    const X=Xs[n];scenery(i,(img,ww,off)=>items.push({z,img,ww,off,X}));
  }
  for(const c of cars){
    const z=c.z-position;if(z<=PZ*.45||z>far)continue;
    const fi=c.z/SEG-baseIdx,n=Math.floor(fi),p=fi-n;if(n<0||n>DRAW)continue;
    items.push({z,img:c.img,ww:c.ww,off:c.x,X:Xs[n]+(Xs[n+1]-Xs[n])*p,car:c});
  }
  items.sort((a,b)=>b.z-a.z);
  let pd=false;
  for(const it of items){if(!pd&&it.z<PZ){drawPlayer();pd=true;}drawItem(it,camX);}
  if(!pd)drawPlayer();

  if(speed>12500&&state==='play'&&!braking){
    const a=Math.min(.35,(speed-12500)/12000);ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=1.5;
    for(let k=0;k<6;k++){const side=k%2?1:-1,y=HOR+K*(.2+hash(Math.floor(time*20)+k)*.7),x0=W/2+side*W*(.42+hash(k+Math.floor(time*20))*.08);
      ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+side*W*.12,y+K*.08);ctx.stroke();}
  }
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.7})`;ctx.fillRect(0,0,W,H);}
  if(state==='play'||state==='crash')drawHUD();
}
function pill(x,y,w,h,col){ctx.fillStyle=col;rr(ctx,x,y,w,h,h/2);}
function drawHUD(){
  const L=T[lang];
  ctx.textBaseline='alphabetic';
  pill(10,10,150,52,'rgba(0,0,0,.42)');
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='800 10px system-ui';ctx.textAlign='left';
  ctx.fillText(L.score.toUpperCase(),26,27);
  ctx.fillStyle='#fff';ctx.font='900 24px system-ui';ctx.fillText(fmt(score),26,52);
  pill(W-118,10,108,52,'rgba(0,0,0,.42)');
  ctx.textAlign='right';ctx.fillStyle=braking?'#ff6b6b':'#fff';ctx.font='italic 900 26px system-ui';ctx.fillText(kmh(speed),W-50,47);
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='800 11px system-ui';ctx.fillText('km/h',W-20,47);
  if(combo>1&&comboTimer>0){
    pill(10,68,118,26,'rgba(255,200,61,.92)');
    ctx.fillStyle='#1a1200';ctx.textAlign='left';ctx.font='900 13px system-ui';ctx.fillText(L.combo+' ×'+combo,22,86);
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(84,79,36*(1-comboTimer/3),5);
  }
  if(playerX<0&&state==='play'){
    const p=.75+.25*Math.sin(time*12);ctx.globalAlpha=p;
    ctx.font='900 14px system-ui';const tw=ctx.measureText(L.wrong).width+28;
    pill(W/2-tw/2,72,tw,28,'#e01e1e');ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(L.wrong,W/2,91);
    ctx.globalAlpha=1;
  }
  if(banner){
    const t=banner.t,a=t<.3?t/.3:t>2.2?Math.max(0,(2.8-t)/.6):1,name='📍 '+banner.name[lang];
    ctx.globalAlpha=a;ctx.textAlign='center';
    ctx.font='italic 900 24px system-ui';const tw=Math.max(ctx.measureText(name).width+40,170);
    pill(W/2-tw/2,H*.34,tw,58,'rgba(10,12,28,.72)');
    ctx.fillStyle='#ffc83d';ctx.font='900 10px system-ui';ctx.fillText(L.newArea,W/2,H*.34+19);
    ctx.fillStyle='#fff';ctx.font='italic 900 22px system-ui';ctx.fillText(name,W/2,H*.34+45);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='center';
  popups.forEach((p,k)=>{
    const a=Math.max(0,1-p.t/1.2),y=H*.25-p.t*40+k*4,s=p.t<.12?.6+p.t/.12*.4:1;
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,y);ctx.scale(s,s);
    ctx.font='italic 900 26px system-ui';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(p.txt,0,0);
    ctx.fillStyle=p.col;ctx.fillText(p.txt,0,0);
    if(p.sub){ctx.font='900 15px system-ui';ctx.strokeText(p.sub,0,22);ctx.fillStyle='#fff';ctx.fillText(p.sub,0,22);}
    ctx.restore();
  });
  if(hintT<3&&state==='play'){
    ctx.globalAlpha=Math.min(1,(3-hintT))*.55;ctx.fillStyle='#fff';ctx.font='900 40px system-ui';
    ctx.fillText('◀',W*.14,H*.62);ctx.fillText('▶',W*.86,H*.62);ctx.globalAlpha=1;
  }
}

/* ---------------- INPUT ---------------- */
function sideOf(e){const r=stage.getBoundingClientRect();return (e.clientX-r.left)<r.width/2?-1:1;}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;if(state!=='play')return;e.preventDefault();pointers.set(e.pointerId,sideOf(e));try{stage.setPointerCapture(e.pointerId)}catch(_){}} ,{passive:false});
stage.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,sideOf(e));});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>stage.addEventListener(t,e=>pointers.delete(e.pointerId)));
stage.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('#ctrl button').forEach(b=>{
  const k=b.dataset.c;
  const on=e=>{e.preventDefault();ctrl[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{ctrl[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on,{passive:false});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const isL=k=>k==='ArrowLeft'||k==='a'||k==='A',isR=k=>k==='ArrowRight'||k==='d'||k==='D',isB=k=>k==='ArrowDown'||k==='s'||k==='S'||k===' ';
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(isL(k)){keys.l=true;e.preventDefault();}
  if(isR(k)){keys.r=true;e.preventDefault();}
  if(state==='play'&&isB(k)){keys.b=true;e.preventDefault();return;}
  if((k==='Enter'||k===' ')&&(state==='menu'||state==='over')&&!garageFrom){e.preventDefault();startGame();}
});
window.addEventListener('keyup',e=>{const k=e.key;if(isL(k))keys.l=false;if(isR(k))keys.r=false;if(isB(k))keys.b=false;});
$('#playBtn').addEventListener('click',startGame);
$('#againBtn').addEventListener('click',startGame);
$('#garageBtn1').addEventListener('click',()=>openGarage('menu'));
$('#garageBtn2').addEventListener('click',()=>openGarage('over'));
$('#backBtn').addEventListener('click',closeGarage);
$('#shareBtn').addEventListener('click',async()=>{
  const txt=T[lang].shareTxt(fmt(score),nears,(dist*0.005/1000).toFixed(2));
  try{if(navigator.share){await navigator.share({text:txt});return;}}catch(e){return;}
  try{await navigator.clipboard.writeText(txt);const b=$('#shareBtn');b.textContent=T[lang].copied;setTimeout(()=>b.textContent=T[lang].share,1500);}catch(e){}
});
document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=performance.now();});

/* ---------------- LOOP ---------------- */
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!paused&&state!=='over')update(dt);
  render();
  requestAnimationFrame(frame);
}
applyLang();buildRoad();resize();toMenu();
$('#bestMenu').textContent=fmt(best);refreshCoins();
requestAnimationFrame(frame);
setTimeout(sendH,300);
})();
